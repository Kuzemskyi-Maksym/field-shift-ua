# Календар сівби з джерелами (зібрано 13.11.2026). Заповнює model/crops.yaml calendar.<zone>.
# Зони: steppe = Одеська, Миколаївська (Південний Степ); forest_steppe = Полтавська, Вінницька; polissia = Волинська.
# Правило: дата в моделі = середина вікна (opt), вікно — для чутливості. Цитати — дослівно з джерел.

sources:
  ISGP2026_POSIV: "Рижук С.М., Савчук О.І. та ін. Рекомендації щодо сівби озимих… Інститут сільського господарства Полісся НААН; Житомирська ОДА, 2026. https://www.isgpnaan.org/upload/rekomendatsii-posiv-2026.pdf"
  ISGP2026_VPR: "Рижук С.М., Савчук О.І. та ін. Рекомендації з проведення весняно-польових робіт 2026. Інститут сільського господарства Полісся НААН, 2026 (схвалено вченою радою, протокол №1 від 26.02.2026). https://isgpnaan.org/upload/1-rekomendatsii-vpr-2026.pdf"
  YURIEV2023_OSIN: "Особливості проведення осіннього комплексу польових робіт у господарствах Харківської області в умовах воєнного стану 2023 року. Інститут рослинництва ім. В.Я. Юр'єва НААН, 2023, розд. 5, с. 18. https://yuriev.com.ua/assets/files/navchalni-posibnyky/osinnij-kompleks-2023.pdf"
  YURIEV2019_VPR: "Агротехнологічна стратегія проведення весняно-польових робіт у господарствах Харківської області в 2019 році. Інститут рослинництва ім. В.Я. Юр'єва НААН, 2019. https://yuriev.com.ua/assets/files/knigi/vpr-2019.pdf"
  IZZ2018_OZYMI: "Вожегова Р.А., Заєць С.О., Коваленко А.М. та ін. Агротехнологічні вимоги до сівби озимих культур під урожай 2019 року у Південному Степу України. Херсон–Миколаїв: ІЗЗ НААН, 2018, 44 с. https://dspace.mnau.edu.ua/jspui/bitstream/123456789/4638/1/Ahrotekhnolohichni%20umovy_2019.pdf"
  HLS_PHENO: "Наші дані: HLS 30 м, 250 полів, 2016–2025 — data/raw/hls_phenology_by_oblast.csv (метод у колонці method)"

# ---------- ОЗИМІ: фіксовані вікна сівби (дати)
winter:
  winter_wheat:
    steppe:        {window: ["09-15", "10-10"], opt: "09-28", src: IZZ2018_OZYMI, page: 18, quote: "при її сівбі 10-15 вересня – 5-10 жовтня", note: "Південний Степ; вікно взято 15.09–10.10 (межі цитати)"}
    forest_steppe: {window: ["09-10", "09-25"], opt: "09-18", src: YURIEV2023_OSIN, page: 18, quote: "кращими строками сівби пшениці озимої для лісостепової зони Харківської області є період з 10 по 25 вересня", note: "допустимий до 01.10; загальне для Лісостепу: оптимальні 10–30 вересня"}
    polissia:      {window: ["09-15", "09-22"], opt: "09-18", src: ISGP2026_POSIV, page: 10, quote: "Строки сівби: 15–22 вересня."}
  winter_barley:
    steppe:        {window: ["09-20", "10-01"], opt: "09-25", src: IZZ2018_OZYMI, page: 31, quote: "для північних районів південного Степу є з 20 вересня по 1 жовтня, для південних - з 1 по 10 жовтня", note: "для Березівки (південь Одеської) — 01–10.10"}
    forest_steppe: {window: null, src: null, note: "джерела для Лісостепу не знайдено — TODO"}
    polissia:      {window: ["09-20", "09-30"], opt: "09-25", src: ISGP2026_POSIV, page: 17, quote: "Поліська зона: 20 вересня – 30 вересня."}
  rye:
    steppe:        {window: ["09-11", "09-30"], opt: "09-20", src: IZZ2018_OZYMI, page: 33, quote: "Сіяти ці культури слід у 2–3 декаді вересня"}
    forest_steppe: {window: null, src: null, note: "TODO"}
    polissia:      {window: ["09-10", "09-20"], opt: "09-15", src: ISGP2026_POSIV, page: 20, quote: "Полісся: 10–20 вересня."}
  winter_rapeseed:
    steppe:        {window: ["09-01", "09-10"], opt: "09-05", src: IZZ2018_OZYMI, page: 35, quote: "Кращим строком сівби для сортів ріпаку озимого є І декада вересня"}
    forest_steppe: {window: null, src: null, note: "TODO"}
    polissia:      {window: ["08-15", "08-25"], opt: "08-20", src: ISGP2026_POSIV, page: 25, quote: "Оптимальні строки (15–25 серпня)", note: "загальна рекомендація, не окремо для Полісся"}

# ---------- ЯРІ: джерела дають критерій ТЕМПЕРАТУРИ ҐРУНТУ, а не дату.
# Рекомендований метод: дата сівби в кожному році погоди = перший день після not_before,
# коли 5-денна середня температура досягає порогу (динамічна сівба — сама показує «зсув» весни).
# POWER: спершу перевір, чи є температура ґрунту (напр., TSOIL1) для community=AG; якщо ні — проксі T2M з прапорцем
# «температура ґрунту оцінена за температурою повітря». Перевірка проксі: медіанна дата має потрапити у явні вікна нижче.
spring:
  pea:           {soil_t_c: [4, 10], depth_cm: null, src: ISGP2026_VPR, page: 25, quote: "Висівають горох у надранні строки за настання фізичної стиглості посівного шару та температури ґрунту 4–10°С", not_before: "03-01"}
  spring_wheat:  {soil_t_c: null, src: [ISGP2026_VPR, YURIEV2019_VPR], quote: "Ранні ярі зернові слід сіяти у ранні строки, як тільки дозволяє стан ґрунту (ISGP2026, с. 18); сівби в перші 3-5 днів після настання фізичної стиглості ґрунту (Yuriev2019, с. 22)", rule: "як горох (поріг 4 °C) — ПРАПОРЕЦЬ: поріг гороху застосовано до ранніх ярих", not_before: "03-01"}
  spring_barley: {soil_t_c: null, src: [ISGP2026_VPR, YURIEV2019_VPR], quote: "Ранні ярі зернові … ранні строки; ячмінь у ранні строки, як тільки ґрунт досягне фізичної стиглості (Yuriev2019, с. 28)", rule: "як горох (4 °C), прапорець", not_before: "03-01"}
  oats:          {soil_t_c: null, src: ISGP2026_VPR, page: 18, rule: "як горох (4 °C), прапорець", not_before: "03-01"}
  sunflower:     {soil_t_c: [8, 12], depth_cm: 10, src: [ISGP2026_VPR, YURIEV2019_VPR], quote: "Коли ґрунт на глибині загортання насіння прогріється до 8–10 С (ISGP2026, с. 35); за прогрівання десяти сантиметрового шару ґрунту до 10–12 оС (Yuriev2019, с. 34)", threshold_used: 10}
  maize:         {soil_t_c: [10, 12], depth_cm: 10, src: ISGP2026_VPR, page: 33, quote: "Оптимальний термін сівби більшості сучасних гібридів настає, коли температура на глибині 10 см сягає значення 10–12 С", explicit_window: {zones: [forest_steppe, polissia], window: ["04-25", "05-05"], quote: "для Лісостепу і Полісся період з 25 квітня по 5 травня"}, threshold_used: 10}
  soybean:       {soil_t_c: [8, 14], depth_cm: 10, src: [ISGP2026_VPR, YURIEV2019_VPR], quote: "ґрунт на глибині 10 см прогрівається до 8–10оС (ISGP2026, с. 22); 12-14 оС на глибині заробки насіння (Yuriev2019, с. 31)", explicit_window: {zones: [forest_steppe, polissia], window: ["04-25", "05-10"], quote: "Календарні строки сівби припадають на кінець третьої декади квітня або першу декаду травня (Yuriev2019, с. 31)"}, threshold_used: 10, note: "пороги джерел різні: 8–10 (Полісся) і 12–14 (Харків) — у чутливість"}
  millet:        {soil_t_c: [12, 15], depth_cm: 10, src: [ISGP2026_VPR, YURIEV2019_VPR], quote: "коли ґрунт на глибині 10 см прогріється до 12–15°С", threshold_used: 12}
  buckwheat:     {soil_t_c: [10, 12], depth_cm: 10, src: ISGP2026_VPR, page: 30, note: "немає в crops.yaml"}
  sugar_beet:    {soil_t_c: null, src: null, note: "у знайдених рекомендаціях строків сівби буряку немає — лишається STUB"}
  sorghum:       {soil_t_c: null, src: null, note: "TODO"}

# ---------- ЗБИРАННЯ / ФАЗИ: перевірка з наших даних NASA (HLS), не з літератури
# Медіани по 2016–2025 (data/raw/hls_phenology_by_oblast.csv):
#   озимі (W): зелене (NDVI>0.5) 28.03–21.04; пік 19.05–05.06; спад NDVI<0.35 (≈ дозрівання): 05–10.07 Степ і Полтава, 06.08 Вінниця й Волинь
#   ярі пізні (S late, кукурудза/соя?): змикання 16–20.06; пік 19–31.07; спад 16.09 (Миколаїв) … 13.10 (Вінниця)
#   ярі ранні (S early, соняшник/ярі зернові?): пік 14.06–02.07; спад 06–29.08
# Використання: (1) озимим stage_dates — дати HLS замість BASELINE_V0, src: HLS_PHENO, прапорець «фази з NDVI полів, не з агрономічних джерел»;
#               (2) ярим — перевірка: дата збирання з FAO-фаз від нової дати сівби має бути в межах ±15 днів від HLS senes; якщо ні — звіт, не підганяти.
