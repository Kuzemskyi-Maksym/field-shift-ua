# Publishes the prebuilt static site (site/index.html, data embedded) to GitHub Pages.
# No build step: the page is rebuilt locally with site/build_site.py and committed.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the page
        run: |
          mkdir _site
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
